services:
  - type: web
    name: relo-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_RELO_API_URL
        value: https://relo-api-ernh.onrender.com

  - type: web
    name: relo-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://relo-web-ernh.onrender.com
      - key: SUPABASE_URL
        value: https://rxmkcjjiyrteooztynsr.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Render free does not provide a background-worker service. This web service
  # keeps the worker process boundary and exposes only a health endpoint until
  # the deployment is moved to a paid background worker plan.
  - type: web
    name: relo-worker
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_HTTP_PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://rxmkcjjiyrteooztynsr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
